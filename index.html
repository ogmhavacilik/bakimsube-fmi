                        const txName = String(tx.personName).trim().toLocaleUpperCase('tr-TR');
                        const matchedPerson = personnel.find(p => String(p.fullName).trim().toLocaleUpperCase('tr-TR') === txName);
                        if (matchedPerson) {
                            pid = String(matchedPerson.id).trim().toLowerCase();
                        }
                    }
                    if (map[pid]) {
                        const txDateStr = String(tx.date || '');
                        if (!txDateStr.startsWith('2026')) return;

                        const status = String(tx.status || '').toUpperCase();
                        if (status !== 'APPROVED' && status !== 'ONAYLANDI' && status !== 'ONAYLI' && tx.status) return;

                        const txId = String(tx.id || tx.ID || '');
                        const isAuto = txId.startsWith('auto-') || txId.includes('sync');
                        const descUpper = String(tx.description || tx.DESCRIPTION || '').toLocaleUpperCase('tr-TR');
                        const txLoc = String(tx.location || tx.DUTY_LOC || tx.LOCATION || '').toLocaleUpperCase('tr-TR');
                        const txNote = String(tx.note || tx.NOTE || '').toLocaleUpperCase('tr-TR');
                        const dateStr = formatDateLocal(tx.date);
                        const dayType = getDayType(dateStr) === DAY_TYPES.HOLIDAY ? DAY_TYPES.HOLIDAY : (tx.dayType || getDayType(dateStr));
                        const isHolidayDate = dayType === DAY_TYPES.HOLIDAY;
                        
                        if (isOverseas(txLoc) || isOverseas(descUpper) || isOverseas(txNote)) return;
                        if (descUpper.includes('YURT DIŞI') || descUpper.includes('YURTDIŞI') || descUpper.includes('OVERSEAS') || txNote.includes('YURT DIŞI') || txNote.includes('YURTDIŞI') || txNote.includes('OVERSEAS')) return;

                        const hasBeklemeInText = txId.toLowerCase().includes('standby') || descUpper.includes('BEKLEME');
                        const isExplicitHolidayStandby = descUpper.includes('RESMİ BEKLEME') || descUpper.includes('RESMI BEKLEME') || descUpper.includes('TATİL-BEKLEME') || descUpper.includes('TATIL-BEKLEME') || descUpper.includes('RESMİ TATİL BEKLEME') || descUpper.includes('RESMI TATIL BEKLEME') || descUpper.includes('RESMİ TATİL') || descUpper.includes('RESMI TATIL') || txId.toLowerCase().includes('hstandby') || txId.toLowerCase().includes('holidaystandby');
                        
                        const isHolidayStandby = hasBeklemeInText && (isHolidayDate || isExplicitHolidayStandby);
                        const isStandby = hasBeklemeInText && !isHolidayStandby;
                        
                        const isPlannedDuty = !descUpper.includes('PLANSIZ') && (txId.includes('auto_duty') || descUpper.includes('OTOMATİK GÖREV') || descUpper.includes('PLANLI GÖREV') || descUpper.includes('PLANLI GOREV') || tx.isPlanned === true);
                        const isAutoDuty = txId.includes('auto_duty');
                        const isDuty = !isStandby && !isHolidayStandby && !isPlannedDuty;

                        const personObj = personnelMap.get(cleanPersonnelId(pid)) || personnel.find(p => cleanPersonnelId(p.id) === pid);
                        const isDriverPerson = checkIsDriver(personObj);
                        const inSeason = isStandbyDate(dateStr);
                        if ((isStandby || isHolidayStandby) && !inSeason && !isDriverPerson && !isAuto) return;

                        if (isAutoDuty && !isPlannedDutySeason(dateStr)) return;

                        const isAnyDuty = isDuty || isPlannedDuty;

                        const datePart = dateStr;
                        const [y, mm, dd] = datePart.split('-').map(Number);
                        if (isNaN(y) || isNaN(mm) || isNaN(dd)) return;

                        const rawHours = parseFloat(tx.hours || 0);
                        const rawDays = parseFloat(tx.days || 1);
                        
                        let h = rawHours;
                        if (tx.type === TRANSACTION_TYPES.USED && h === 0 && rawDays > 0) h = rawDays * 8;
                        if (tx.type === TRANSACTION_TYPES.EARNED && h === 0 && rawDays > 0) h = rawDays * 8;

                        if (tx.type === TRANSACTION_TYPES.EARNED) {
                            const person = personObj;
                            const title = (person?.title || '').toLocaleUpperCase('tr-TR');
                            const name = (person?.fullName || '').toLocaleUpperCase('tr-TR');
                            
                            const isTechnical = ['UÇAK TEKNİKERİ', 'UÇAK TEKNİSYENİ'].some(t => title.includes(t)) && !(name.includes('SERKAN KOTAN') || name.includes('SERKAN KÖTEN'));
                            
                            const numDays = parseFloat(tx.days || 1);
                            const hoursPerDay = h / numDays;

                            for (let i = 0; i < Math.max(1, Math.ceil(numDays)); i++) {
                                const cur = new Date(y, mm - 1, dd + i);
                                const curStr = formatDateLocal(cur);
                                const dayKey = `${pid}_${curStr}`;
                                
                                let points = hoursPerDay;
                                let skip = false;

                                const isWk = cur.getDay() === 0 || cur.getDay() === 6;
                                const isStandbyInYoklama = attendanceStandbySet.has(`${pid}_${curStr}`);
                                const hasDutyOnThisDay = dutyDaysSet.has(`${pid}_${curStr}`);

                                if (isHolidayStandby) {
                                    if (processedDays.STANDBY.has(dayKey)) skip = true;
                                    else {
                                        processedDays.STANDBY.add(dayKey);
                                        if (hasDutyOnThisDay) {
                                            points = 0;
                                            skip = true;
                                        } else if (isDriverPerson) {
                                            points = 10.0;
                                        } else {
                                            points = 2.0;
                                        }
                                    }
                                } else if (isStandby) {
                                    if (processedDays.STANDBY.has(dayKey)) skip = true;
                                    else {
                                        processedDays.STANDBY.add(dayKey);
                                        if (!isStandbyDate(curStr) && !isDriverPerson) skip = true;
                                        else if (hasDutyOnThisDay) {
                                            points = 0;
                                            skip = true;
                                        } else if (isDriverPerson) {
                                            points = isWk ? 10.0 : 1.0;
                                        } else if (isTechnical && isWk) {
                                            points = 2.0;
                                        } else {
                                            points = 1.0;
                                        }
                                    }
                                } else if (isAnyDuty) {
                                    const dayType = tx.dayType || getDayType(curStr);
                                    const isInSeason = isPlannedDutySeason(curStr);
                                    const isThisPlanned = isPlannedDuty || (isAutoDuty && isInSeason);

                                    if (!isAuto) {
                                        if (isDriverPerson && isStandbyInYoklama) {
                                            points = Math.max(0, hoursPerDay - 1.0);
                                        } else {
                                            points = hoursPerDay;
                                        }
                                        const dayStats = map[pid].breakdown[dayType] || { day: 0, night: 0 };
                                        if (String(tx.shift).toUpperCase().includes('GECE')) dayStats.night += points; 
                                        else dayStats.day += points;
                                        map[pid].breakdown[dayType] = dayStats;
                                    } else if (isTechnical && isWk && isStandbyInYoklama) {
                                        points = 10.0;
                                        if (isThisPlanned) {
                                            if (processedDays.PLANNED_DUTY.has(dayKey)) skip = true;
                                            else {
                                                processedDays.PLANNED_DUTY.add(dayKey);
                                                map[pid].plannedDutyWeekend.days += 1;
                                                map[pid].plannedDutyWeekend.hours += points;
                                            }
                                        } else {
                                            const dayStats = map[pid].breakdown[dayType] || { day: 0, night: 0 };
                                            if (String(tx.shift).toUpperCase().includes('GECE')) dayStats.night += points; 
                                            else dayStats.day += points;
                                            map[pid].breakdown[dayType] = dayStats;
                                        }
                                    } else if (isThisPlanned) {
                                        if (processedDays.PLANNED_DUTY.has(dayKey)) skip = true;
                                        else {
                                            processedDays.PLANNED_DUTY.add(dayKey);
                                            if (isWk) {
                                                points = 11.0;
                                                map[pid].plannedDutyWeekend.days += 1;
                                                map[pid].plannedDutyWeekend.hours += points;
                                            } else {
                                                points = 3.0; 
                                                map[pid].plannedDutyWeekday.days += 1;
                                                map[pid].plannedDutyWeekday.hours += points;
                                            }
                                        }
                                    } else {
                                        points = hoursPerDay * getMultiplier(dayType, isTechnical);
                                        const dayStats = map[pid].breakdown[dayType] || { day: 0, night: 0 };
                                        if (String(tx.shift).toUpperCase().includes('GECE')) dayStats.night += hoursPerDay; 
                                        else dayStats.day += hoursPerDay;
                                        map[pid].breakdown[dayType] = dayStats;
                                    }
                                }

                                if (skip) continue;

                                let dayType = tx.dayType || getDayType(curStr);
                                map[pid].score += points;

                                if (tx.note) {
                                    const noteKey = String(tx.note).toLocaleUpperCase('tr-TR').trim();
                                    if (noteKey) {
                                        map[pid].notesBreakdown[noteKey] = (map[pid].notesBreakdown[noteKey] || 0) + points;
                                    }
                                }

                                if (isHolidayStandby) {
                                    map[pid].holidayStandbyDays = (map[pid].holidayStandbyDays || 0) + 1;
                                    map[pid].holidayStandby += points;
                                } else if (isStandby) {
                                    map[pid].standbyDays = (map[pid].standbyDays || 0) + 1;
                                    map[pid].standby += points;
                                }
                                else if (isAnyDuty) {
                                    // Handled above
                                } else {
                                    const dayStats = map[pid].breakdown[dayType] || { day: 0, night: 0 };
                                    if (String(tx.shift).toUpperCase().includes('GECE')) dayStats.night += hoursPerDay;
                                    else dayStats.day += hoursPerDay;
                                    map[pid].breakdown[dayType] = dayStats;
                                }
                            }
                        } else if (tx.type === TRANSACTION_TYPES.USED) {
                            const statusUpper = String(tx.status || '').toUpperCase();
                            if (statusUpper === 'APPROVED' || statusUpper === 'ONAYLANDI' || statusUpper === 'ONAYLI' || !tx.status) {
                                const dateStr = String(tx.date || '').split(' ')[0];
                                const dKey = `${pid}_${dateStr}`;
                                if (!countedUsedDates.has(dKey)) {
                                    countedUsedDates.add(dKey);
                                    const valence = parseFloat(tx.hours || (tx.days ? tx.days * 8 : 8));
                                    map[pid].used += valence;
                                    map[pid].score -= valence;
                                    processedDays.USED.add(dKey);
                                }
                            }
                        }
                    }
                });

                Object.keys(map).forEach(id => {
                    map[id].earned = parseFloat((map[id].score + map[id].used).toFixed(1));
                    map[id].balance = parseFloat((map[id].score || 0).toFixed(1));
                    map[id].standbyDays = map[id].standbyDays || 0;
                    map[id].standby = parseFloat((map[id].standby || 0).toFixed(1));
                    map[id].holidayStandbyDays = map[id].holidayStandbyDays || 0;
                    map[id].holidayStandby = parseFloat((map[id].holidayStandby || 0).toFixed(1));
                });

                return map;
            }, [personnel, filteredTransactions, attendanceRecords, personnelMap]);

            // Auto calculate hours and shift
            useEffect(() => {
                if (modalType === 'add' && formData.startTime && formData.endTime) {
                    const cleanTime = (tStr) => {
                        if (!tStr) return [0, 0];
                        let s = String(tStr).trim().replace('.', ':');
                        if (!s.includes(':')) {
                            if (s.length === 4) s = s.substring(0,2) + ':' + s.substring(2);
                            else if (s.length === 3) s = '0' + s.substring(0,1) + ':' + s.substring(1);
                        }
                        const parts = s.split(':').map(Number);
                        return [parts[0] || 0, parts[1] || 0];
                    };
                    const [sH, sM] = cleanTime(formData.startTime);
                    const [eH, eM] = cleanTime(formData.endTime);
                    let diff = (eH + eM/60) - (sH + sM/60);
                    if (!(diff >= 0)) diff += 24;

                    const newHours = diff.toFixed(1);
                    const detectedShift = (sH >= 20 || !(sH >= 6)) ? 'Gece' : 'Gündüz';

                    if (formData.hours !== newHours || formData.shift !== detectedShift) {
                        setFormData(prev => ({ 
                            ...prev, 
                            hours: newHours,
                            shift: detectedShift
                        }));
                    }
                } else if (modalType === 'use' && formData.date && formData.endDate) {
                    const parseLocalDateUTC = (dateStr) => {
                        if (!dateStr) return null;
                        const normalized = formatDateLocal(dateStr);
                        const parts = normalized.split('-');
                        if (parts.length === 3) {
                            return new Date(Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10), 12, 0, 0));
                        }
                        return new Date(normalized);
                    };
                    const start = parseLocalDateUTC(formData.date);
                    const end = parseLocalDateUTC(formData.endDate);
                    
                    if (start && !isNaN(start.getTime()) && end && !isNaN(end.getTime())) {
                        // Ensure end date is not before start date
                        if (!(end >= start)) {
                            setFormData(prev => ({ ...prev, endDate: formData.date, days: '1', hours: '8.0' }));
                        } else {
                            const diffTime = Math.abs(end.getTime() - start.getTime());
                            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
                            const newHours = (diffDays * 8).toFixed(1);
                            
                            if (formData.days !== String(diffDays) || formData.hours !== newHours) {
                                setFormData(prev => ({ ...prev, days: String(diffDays), hours: newHours }));
                            }
                        }
                    }
                }
            }, [formData.startTime, formData.endTime, formData.days, formData.date, modalType, formData.hours, formData.shift, formData.endDate]);

            // Auto-update dayType when date changes
            useEffect(() => {
                if (formData.date) {
                    const newDayType = getDayType(formData.date);
                    setFormData(prev => ({ ...prev, dayType: newDayType }));
                }
            }, [formData.date]);

            // Auto format time inputs (e.g. "08" -> "08:")
            const handleTimeChange = (field, rawValue) => {
                const prevValue = formData[field] || '';
                if (!rawValue) {
                    setFormData(prev => ({ ...prev, [field]: '' }));
                    return;
                }
                
                let val = rawValue.replace(/[.,]/g, ':').replace(/[^0-9:]/g, '');

                if (prevValue && prevValue.endsWith(':') && val === prevValue.slice(0, -1)) {
                    setFormData(prev => ({ ...prev, [field]: val.slice(0, -1) }));
                    return;
                }

                const digits = val.replace(/[^0-9]/g, '');
                let formatted = val;

                if (digits.length > 2) {
                    formatted = digits.slice(0, 2) + ':' + digits.slice(2, 4);
                } else if (digits.length === 2 && !val.includes(':') && prevValue.length < rawValue.length) {
                    formatted = digits + ':';
                } else if (digits.length <= 2) {
                    formatted = val;
                }

                const finalVal = formatted.slice(0, 5);
                setFormData(prev => ({ ...prev, [field]: finalVal }));

                if (field === 'startTime' && digits.length >= 4 && prevValue.replace(/[^0-9]/g, '').length < 4) {
                    setTimeout(() => {
                        const endTimeEl = document.getElementById('endTimeInput');
                        if (endTimeEl) {
                            endTimeEl.focus();
                            endTimeEl.select?.();
                        }
                    }, 30);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if ((loginData.username === 'ogm1' || loginData.username === 'ogm2') && loginData.password === '1839') {
                    setAdminRole(loginData.username);
                    localStorage.removeItem('ogm_admin_role');
                    setShowLogin(false);
                    setActiveTab('admin');
                } else {
                    alert('Hatalı kullanıcı adı veya şifre!');
                }
            };

            const handleLogout = () => {
                setAdminRole(null);
                localStorage.removeItem('ogm_admin_role');
                setActiveTab('home');
            };

            const openPendingDetailModal = (tx) => {
                const person = personnel.find(p => cleanPersonnelId(p.id) === cleanPersonnelId(tx.personId)) || { id: tx.personId, fullName: tx.personName };
                setSelectedPendingTx(tx);
                setSelectedPerson(person);
                setModalType(tx.type === TRANSACTION_TYPES.USED ? 'use' : 'add');
                setFormData({
                    personId: person.id || tx.personId || '',
                    date: tx.date || '',
                    endDate: tx.endDate || tx.date || '',
                    startTime: tx.startTime || '08:00',
                    endTime: tx.endTime || '17:00',
                    dayType: tx.dayType || (tx.date ? getDayType(tx.date) : ''),
                    hours: String(tx.hours || ''),
                    days: String(tx.days || '1'),
                    description: tx.description || tx.DESCRIPTION || tx.note || '',
                    shift: tx.shift || 'Gündüz'
                });
            };

            const handleAddOvertime = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                setIsSaving(true);

                try {
                    // 0. APPROVE PENDING REQUEST FROM DETAIL MODAL
                    if (selectedPendingTx) {
                        try {
                            const person = selectedPerson || personnel.find(p => cleanPersonnelId(p.id) === cleanPersonnelId(formData.personId || selectedPendingTx.personId));
                            const pid = person?.id || selectedPendingTx.personId;
                            const pname = person?.fullName || selectedPendingTx.personName;
                            const finalHours = parseFloat(formData.hours) || parseFloat(selectedPendingTx.hours) || 0;

                            const updatedTx = {
                                ...selectedPendingTx,
                                personId: pid,
                                personName: pname,
                                date: formData.date || selectedPendingTx.date,
                                endDate: (modalType === 'use' || selectedPendingTx.type === TRANSACTION_TYPES.USED) ? (formData.endDate || formData.date || selectedPendingTx.endDate) : (formData.date || selectedPendingTx.date),
                                days: (modalType === 'use' || selectedPendingTx.type === TRANSACTION_TYPES.USED) ? parseFloat(formData.days || selectedPendingTx.days || 1) : 1,
                                hours: finalHours,
                                shift: formData.shift || selectedPendingTx.shift || 'Gündüz',
                                dayType: formData.dayType || selectedPendingTx.dayType || (formData.date ? getDayType(formData.date) : ''),
                                description: formData.description || selectedPendingTx.description || selectedPendingTx.note || '',
                                note: formData.description || selectedPendingTx.note || '',
                                status: 'APPROVED'
                            };

                            const updatedList = transactions.map(t => t.id === selectedPendingTx.id ? { ...updatedTx, status: 'APPROVED' } : t);
                            setTransactions(updatedList);
                            safeLocalStorageSetItem('ogm_transactions', JSON.stringify(updatedList));
                            safeLocalStorageSetItem('ogm_overtime_tx', JSON.stringify(updatedList));

                            showToast("Talep incelendi, onaylandı ve sisteme işlendi.");

                            // Background sync
                            apiCall('approve_overtime', { id: selectedPendingTx.id, transaction: updatedTx }, OVERTIME_SCRIPT_URL)
                                .catch(err => showToast("Sunucu onaylama uyarısı: " + (err.message || err), "error"));
                        } catch (err) {
                            showToast("Onaylama hatası: " + (err.message || err), "error");
                        } finally {
                            setIsSaving(false);
                            setModalType(null);
                            setFormData({ date: '', startTime: '', endTime: '', dayType: '', hours: '', description: '', personId: '', days: '1', shift: 'Gündüz', endDate: '' });
                            setSelectedPerson(null);
                            setSearchTerm('');
                            setSelectedPendingTx(null);
                        }
                        return;
                    }

                    // 1. DUPLICATE/OVERLAP CHECK: Prevent same person having overlapping time on same day
                    const person = selectedPerson || personnel.find(p => cleanPersonnelId(p.id) === cleanPersonnelId(formData.personId));
                    const pid = person?.id || formData.personId;

                    if (!person) {
                        setIsSaving(false);
                        showToast('Lütfen işlem yapılacak personeli seçiniz.', 'warning');
                        return;
                    }

                    // CHECK FOR DUTY/STATUS OVERLAP ON USE (Leave Usage)
                    if (modalType === 'use') {
                        const [sY, sM, sD] = (formData.date || '').split('-').map(Number);
                        const [eY, eM, eD] = (formData.endDate || formData.date || '').split('-').map(Number);
                        if (sY && sM && sD) {
                            const start = new Date(sY, sM - 1, sD);
                            const end = new Date(eY || sY, (eM || sM) - 1, eD || sD);
                            
                            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                                const dateStr = formatDateLocal(d);
                                const status = getCurrentAttendanceStatus(pid, dateStr);
                                const statusUpper = String(status || '').toUpperCase();
                                
                                // If status is not "Mevcut" and implies some other duty/leave
                                if (statusUpper !== 'MEVCUT' && statusUpper !== '' && statusUpper !== 'YÜKLENİYOR...') {
                                    setIsSaving(false);
                                    showToast(`DİKKAT: ${pid} nolu personel için ${dateStr} tarihinde zaten bir görev veya durum (${status}) mevcut!`, 'warning');
                                    return;
                                }
                            }
                        }
                    }

                    if (modalType === 'add') {
                        const attendance = getAttendanceRecord(pid, formData.date) || {};
                        const statusRaw = String(attendance.status || 'Mevcut').trim();
                        const statusUpper = statusRaw.toLocaleUpperCase('tr-TR');
                        const noteUpper = String(attendance.note || '').toLocaleUpperCase('tr-TR');
                        const locUpper = String(attendance.location || '').toLocaleUpperCase('tr-TR');

                        const isMevcut = statusUpper === 'MEVCUT' || statusUpper === '' || statusUpper.includes('NORMAL');
                        const isBekleme = statusUpper.includes('BEKLEME') || noteUpper.includes('BEKLEME') || locUpper.includes('BEKLEME');
                        const isGorev = statusUpper.includes('GÖREV') || statusUpper.includes('GOREV') || noteUpper.includes('GÖREV') || noteUpper.includes('GOREV');

                        if (!isMevcut && !isBekleme && !isGorev) {
                            const displayStatus = statusRaw + (attendance.note ? ` (${attendance.note})` : '');
                            setIsSaving(false);
                            showToast(`DİKKAT: ${person?.fullName || pid} yoklamada "${displayStatus}" durumunda görünmektedir! Bu güne mesai yazılamaz.`, 'warning');
                            return;
                        }

                        const isPlannedDuty = isGorev && (attendance.isPlanned !== false);

                        if (isPlannedDuty) {
                            const [h] = (formData.startTime || '00:00').split(':').map(Number);
                            if (!(h >= 19)) {
                                setIsSaving(false);
                                showToast("DİKKAT: Planlı görevde olan personele saat 19:00'dan önce ekstra mesai yazılamaz.", 'warning');
                                return;
                            }
                        }

                        const overlap = transactions.find(tx => 
                            tx && tx.personId === pid && 
                            tx.date === formData.date && 
                            tx.status !== 'REJECTED' &&
                            tx.type === TRANSACTION_TYPES.EARNED &&
                            tx.startTime && tx.endTime &&
                            (
                                (formData.startTime >= tx.startTime && !(formData.startTime >= tx.endTime)) ||
                                (formData.endTime > tx.startTime && !(formData.endTime > tx.endTime)) ||
                                (tx.startTime >= formData.startTime && !(tx.startTime >= formData.endTime))
                            )
                        );

                        if (overlap) {
                            setIsSaving(false);
                            showToast(`DİKKAT: ${pid} nolu personel için bu saat aralığında (${overlap.startTime} - ${overlap.endTime}) zaten bir kayıt mevcut!`, 'warning');
                            return;
                        }
                    }
                    
                    // New Validation Logic
                    const errors = [];
                    
                    if (!person) errors.push('personId');
                    if (!formData.date) errors.push('date');
                    if (modalType === 'add') {
                        if (!formData.startTime) errors.push('startTime');
                        if (!formData.endTime) errors.push('endTime');
                    } else {
                        if (!formData.days || !(parseFloat(formData.days) > 0)) errors.push('days');
                    }
                    if (!formData.hours || !(parseFloat(formData.hours) > 0)) errors.push('hours');
                    if (!formData.description || !(formData.description.trim().length >= 3)) errors.push('description');
                    
                    if (errors.length > 0) {
                        setIsSaving(false);
                        setValidationErrors(errors);
                        setTimeout(() => setValidationErrors([]), 1000);
                        return;
                    }

                    const dayType = formData.dayType || getDayType(formData.date);
                    const isWk = (() => {
                        if (!formData.date) return false;
                        const [y, m, d] = formData.date.split(' ')[0].split('-').map(Number);
                        const dt = new Date(y, m - 1, d);
                        return dt.getDay() === 0 || dt.getDay() === 6;
                    })();
                    
                    // Validation for standby days & Overall Limits
                    let finalHours = parseFloat(formData.hours) || 0;
                    const isDriverPerson = checkIsDriver(person);

                    if (modalType === 'add' || modalType === 'use') {
                        const attendance = getAttendanceRecord(person.id, formData.date) || {};
                        const isStandbyDay = (String(attendance.status || '').toUpperCase().includes('BEKLEME') || String(attendance.note || '').toUpperCase().includes('BEKLEME'));
                        const isTechPerson = checkIsTechnical(person);
                        
                        if (isStandbyDay) {
                            if (!isWk && modalType === 'add') {
                                const parseTimeToHours = (tStr) => {
                                    if (!tStr) return 0;
                                    const parts = String(tStr).trim().replace('.', ':').split(':').map(Number);
                                    return (parts[0] || 0) + ((parts[1] || 0) / 60);
                                };

                    if (sY && sM && sD) {
                        const start = new Date(sY, sM - 1, sD);
                        const end = new Date(eY || sY, (eM || sM) - 1, eD || sD);
                        
                        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {

                    const recordDate = formatDateLocal(r.date);

                    <Modal 
                        isOpen={modalType !== null}

                            (modalType === 'add' ? 'Fazla Mesai Kazanımı' : 'Mesai İzni Kullanımı')
                        }
                    >
                        {modalType === 'history' && selectedPerson ? (
                            <div className="space-y-6">
                                {(() => {
                                    const normalizeId = (id) => String(id || '').trim().toLowerCase();
                                    const normalizeDateSimple = (d) => formatDateLocal(d);

                                    const targetPid = normalizeId(selectedPerson?.id);
                                    const targetName = String(selectedPerson?.fullName || '').toLocaleUpperCase('tr-TR');

                                    const combined = filteredTransactions
                                        .filter(tx => {
                                            const pid = normalizeId(tx.personId);
                                            const dateStr = normalizeDateSimple(tx.date);
                                            const descUpper = String(tx.description || tx.DESCRIPTION || '').toLocaleUpperCase('tr-TR');
                                            const txLoc = String(tx.location || tx.DUTY_LOC || '').toLocaleUpperCase('tr-TR');
                                            const txNote = String(tx.note || '').toLocaleUpperCase('tr-TR');
                                            
                                            if (isOverseas(txLoc) || isOverseas(descUpper) || isOverseas(txNote)) return false;
                                            
                                            const isAnyDuty = descUpper.includes('GÖREV') || descUpper.includes('GOREV');
                                            const txId = String(tx.id || tx.ID || '').toLowerCase();
                                            const isAuto = txId.startsWith('auto-') || txId.includes('sync');
                                            
                                            // Only filter automatic entries by season. Manual sheet entries should always show.
                                            if (isAuto && isAnyDuty) {
                                                if (!isPlannedDutySeason(dateStr)) return false;
                                            }

                                            // Person match
                                            const isPersonMatch = pid === targetPid || 
                                                                (tx.personName && String(tx.personName).toLocaleUpperCase('tr-TR') === targetName);

                                            if (tx.type === TRANSACTION_TYPES.USED && !isAuto) return false;

                                            return isPersonMatch && 
                                                   dateStr.startsWith('2026') &&
                                                   (tx.status === 'APPROVED' || tx.status === 'PENDING' || !tx.status || tx.status === 'MODIFIED');
                                        });

                                    const fmiDeductions = attendanceRecords.filter(r => {
                                        const pid = normalizeId(r.personId);
                                        const status = String(r.status || '').toLocaleUpperCase('tr-TR');
                                        const dateStr = normalizeDateSimple(r.date);
                                        return pid === targetPid && 
                                               dateStr.startsWith('2026') &&
                                               ((status.includes('FMİ') || status.includes('FMI')) || ((status.includes('İZİN') || status.includes('IZIN')) && String(r.leaveType || '').toLocaleUpperCase('tr-TR').includes('FMİ')));
                                    }).map(r => ({
                                        id: `fmi-auto-${r.date}`,
                                        date: normalizeDateSimple(r.date),
                                        type: TRANSACTION_TYPES.USED,
                                        hours: 8,
                                        description: 'FMİ İZİNİ (OTOMATİK DÜŞÜM)',
                                        status: 'APPROVED',
                                        isFmi: true
                                    }));

                                    const gorevSyncs = attendanceRecords.filter(r => {
                                        const pid = normalizeId(r.personId);
                                        const status = String(r.status || '').toLocaleUpperCase('tr-TR');
                                        const loc = String(r.location || r.DUTY_LOC || '').toLocaleUpperCase('tr-TR');
                                        const note = String(r.note || '').toLocaleUpperCase('tr-TR');
                                        const dateStr = normalizeDateSimple(r.date);
                                        
                                        const isBakBnu = note.includes('BAK') || note.includes('BNU') || status.includes('BAK') || status.includes('BNU');
                                        const isPlanned = r.isPlanned === true || String(r.isPlanned || '').toLocaleUpperCase('tr-TR').includes('PLANLI');
                                        const isOverseasDuty = isOverseas(loc) || isOverseas(note) || isOverseas(status);

                                        return pid === targetPid && 
                                               dateStr.startsWith('2026') &&
                                               (status === 'GÖREV' || status.includes('GÖREV') || status.includes('GOREV')) &&
                                               isPlanned &&
                                               !isBakBnu &&
                                               !isOverseasDuty &&
                                               isPlannedDutySeason(dateStr);
                                    }).filter(r => {
                                        const dateStr = normalizeDateSimple(r.date);
                                        return !combined.some(tx => {
                                            const d = normalizeDateSimple(tx.date);
                                            const desc = String(tx.description || tx.DESCRIPTION || '').toLocaleUpperCase('tr-TR');
                                            const id = String(tx.id || tx.ID || '').toLowerCase();
                                            // Check for any duty on this day (auto or manual)
                                            return d === dateStr && (id.includes('duty') || desc.includes('GÖREV') || desc.includes('GOREV'));
                                        });
                                    }).map(r => {
                                        const dateStr = normalizeDateSimple(r.date);
                                        const isInSeason = isPlannedDutySeason(dateStr);
                                        const isWk = (() => {
                                            if (!dateStr) return false;
                                            const [y, m, d] = dateStr.split(' ')[0].split('-').map(Number);
                                            const dt = new Date(y, m - 1, d);
                                            return dt.getDay() === 0 || dt.getDay() === 6;
                                        })();
                                        
                                        // Planned duty is 3h on weekdays, 11h on weekends in season
                                        const points = isInSeason ? (isWk ? 11 : 3) : 8; 

                                        return {
                                            id: `gorev-auto-sync-${r.date}`,
                                            date: dateStr,
                                            location: r.location || r.DUTY_LOC || '',
                                            type: TRANSACTION_TYPES.EARNED,
                                            hours: points,
                                            description: isInSeason ? 'PLANLI GÖREV (OTOMATİK)' : 'PLANSIZ GÖREV (OTOMATİK)',
                                            status: 'APPROVED',
                                            isGorevSync: true,
                                            isPlanned: isInSeason,
                                            note: r.note || ''
                                        };
                                    });

                                    const standbySyncs = attendanceRecords.filter(r => {
                                        const pid = normalizeId(r.personId);
                                        const status = String(r.status || '').toLocaleUpperCase('tr-TR');
                                        const note = String(r.note || '').toLocaleUpperCase('tr-TR');
                                        const loc = String(r.location || r.DUTY_LOC || '').toLocaleUpperCase('tr-TR');
                                        const dateStr = normalizeDateSimple(r.date);
                                        
                                        const isExcluded = status.includes('İZİN') || status.includes('IZIN') || status.includes('RAPOR') || status.includes('İSTİRAHAT') || status.includes('HASTANE');

                                        const isDriverPerson = checkIsDriver(selectedPerson);
                                        return pid === targetPid && 
                                               dateStr.startsWith('2026') &&
                                               (status.includes('BEKLEME') || note.includes('BEKLEME') || loc.includes('BEKLEME')) &&
                                               !isExcluded &&
                                               (isDriverPerson || isStandbyDate(dateStr));
                                    }).filter(r => {
                                        const dateStr = normalizeDateSimple(r.date);
                                        return !combined.some(tx => {
                                            const d = normalizeDateSimple(tx.date);
                                            const id = String(tx.id || tx.ID || '').toLowerCase();
                                            const desc = String(tx.description || tx.DESCRIPTION || '').toLocaleUpperCase('tr-TR');
                                            // Check for any standby or duty on this day
                                            const isStandbyTx = id.includes('standby') || desc.includes('BEKLEME');
                                            const isFmiTx = desc.includes('FMİ') || desc.includes('FMI') || desc.includes('F.M.İ');
                                            return d === dateStr && (isStandbyTx || (!isFmiTx && tx.type === TRANSACTION_TYPES.EARNED));
                                        });
                                    }).map(r => {
                                        const dateStr = normalizeDateSimple(r.date);
                                        const status = String(r.status || '').toLocaleUpperCase('tr-TR');
                                        const note = String(r.note || '').toLocaleUpperCase('tr-TR');
                                        const descJoint = `${status} ${note}`.toLocaleUpperCase('tr-TR');
                                        const isWeeklyOrPublicHoliday = getDayType(dateStr) === DAY_TYPES.HOLIDAY;
                                        const isHoliday = descJoint.includes('RESMİ BEKLEME') || descJoint.includes('RESMI BEKLEME') || descJoint.includes('TATİL-BEKLEME') || descJoint.includes('TATIL-BEKLEME') || descJoint.includes('RESMİ TATİL BEKLEME') || descJoint.includes('RESMI TATIL BEKLEME') || descJoint.includes('RESMİ TATİL') || descJoint.includes('RESMI TATIL') || isWeeklyOrPublicHoliday;
                                        const isWk = checkIsWeekend(dateStr);
                                        const isTechPerson = checkIsTechnical(selectedPerson);
                                        const isDriverPerson = checkIsDriver(selectedPerson);

                                        let standbyHours = 1;
                                        let descText = "BEKLEME-ANKARA";

                                        if (isDriverPerson) {
                                            if (isHoliday) {
                                                standbyHours = 10;
                                                descText = "RESMİ TATİL BEKLEME (10S)";
                                            } else if (isWk) {
                                                standbyHours = 10;
                                                descText = "BEKLEME (HAFTA SONU 10S)";
                                            } else {
                                                standbyHours = 1;
                                                descText = "BEKLEME (HAFTA İÇİ 1S)";
                                            }
                                        } else {
                                            if (isHoliday) {
                                                standbyHours = 2;
                                                descText = "RESMİ TATİL BEKLEME-ANKARA";
                                            } else if (isTechPerson && isWk) {
                                                standbyHours = 2;
                                                descText = "BEKLEME-ANKARA (HAFTA SONU 2P)";
                                            } else {
                                                standbyHours = 1;
                                                descText = "BEKLEME-ANKARA";
                                            }
                                        }

                                        return {
                                            id: `standby-auto-sync-${r.date}`,
                                            date: dateStr,
                                            type: TRANSACTION_TYPES.EARNED,
                                            hours: standbyHours,
                                            description: descText,
                                            status: 'APPROVED',
                                            isStandbySync: true, isHolidayStandby: isHoliday, isStandby: !isHoliday
                                        };
                                    });

                                    const rawItems = [...combined, ...fmiDeductions, ...gorevSyncs, ...standbySyncs];
                                    
                                    // Priority deduplication per day and category
                                     const seen = new Map();
                                     rawItems.forEach(item => {
                                         const d = String(item.date).split(' ')[0];
                                         const descUpper = String(item.description || item.DESCRIPTION || '').toLocaleUpperCase('tr-TR');
                                         const txId = String(item.id || item.ID || '').toLowerCase();
                                         
                                         let category = 'OTHER';
                                         const hasBeklemeInText = txId.includes('standby') || descUpper.includes('BEKLEME');
                                         const isHolidayDate = getDayType(d) === DAY_TYPES.HOLIDAY;
                                         const isExplicitHolidayStandby = descUpper.includes('RESMİ BEKLEME') || descUpper.includes('RESMI BEKLEME') || descUpper.includes('TATİL-BEKLEME') || descUpper.includes('TATIL-BEKLEME') || descUpper.includes('RESMİ TATİL BEKLEME') || descUpper.includes('RESMI TATIL BEKLEME') || descUpper.includes('RESMİ TATİL') || descUpper.includes('RESMI TATIL') || txId.includes('hstandby') || txId.includes('holidaystandby');
                                         const isHolidayStandby = item.isHolidayStandby !== undefined ? item.isHolidayStandby : (hasBeklemeInText && (isHolidayDate || isExplicitHolidayStandby));
                                         const isStandby = item.isStandby !== undefined ? item.isStandby : (hasBeklemeInText && !isHolidayStandby);
                                         const isPlannedDuty = !descUpper.includes('PLANSIZ') && (txId.includes('auto_duty') || descUpper.includes('OTOMATİK GÖREV') || descUpper.includes('PLANLI GÖREV') || descUpper.includes('PLANLI GOREV') || item.isPlanned === true);
                                         const isFmi = descUpper.includes('FMİ') || descUpper.includes('FMI') || descUpper.includes('F.M.İ') || txId.includes('fmi') || item.isFmi || item.type === TRANSACTION_TYPES.USED;
                                         const isDuty = (txId.includes('duty') || descUpper.includes('GÖREV') || descUpper.includes('GOREV') || item.type === TRANSACTION_TYPES.EARNED) && !isStandby && !isHolidayStandby && !isPlannedDuty && !isFmi;

                                         if (isHolidayStandby) category = 'HOLIDAY_STANDBY';
                                         else if (isStandby) category = 'STANDBY';
                                         else if (isPlannedDuty) category = 'PLANNED_DUTY';
                                         else if (isDuty) category = 'DUTY';
                                         else if (isFmi) category = 'FMI';
                                         else if (item.type === TRANSACTION_TYPES.USED) category = 'USED';

                                         const key = d + '_' + category;
                                         const existing = seen.get(key);
                                         
                                         const isManualOverride = txId.startsWith('manual-override');
                                         const isAuto = txId.startsWith('auto-') || txId.includes('sync') || item.isFmi || item.isGorevSync || item.isStandbySync;
                                         
                                         if (!existing) {
                                             seen.set(key, item);
                                         } else {
                                             const exId = String(existing.id || existing.ID || '').toLowerCase();
                                             const existingIsManual = exId.startsWith('manual-override');
                                             const existingIsAuto = exId.startsWith('auto-') || exId.includes('sync') || existing.isFmi || existing.isGorevSync || existing.isStandbySync;
                                             
                                             if (isManualOverride) {
                                                  seen.set(key, item);
                                              } else if (!isAuto && existingIsAuto) {
                                                  seen.set(key, item);
                                              }
                                          }
                                      });

                                    const dutyDatesInModal = new Set();
                                    Array.from(seen.values()).forEach(item => {
                                        const d = String(item.date).split(" ")[0];
                                        const descUpper = String(item.description || item.DESCRIPTION || "").toLocaleUpperCase("tr-TR");
                                        const txId = String(item.id || item.ID || "").toLowerCase();
                                        const isStandby = txId.includes("standby") || descUpper.includes("BEKLEME");
                                        const isFmi = descUpper.includes("FMİ") || descUpper.includes("FMI") || descUpper.includes("F.M.İ") || txId.includes("fmi") || item.isFmi;
                                        if (!isStandby && !isFmi) {
                                            dutyDatesInModal.add(d);
                                        }
                                    });

                                    const allItems = Array.from(seen.values())
                                        .filter(item => {
                                            const d = String(item.date).split(" ")[0];
                                            const descUpper = String(item.description || item.DESCRIPTION || "").toLocaleUpperCase("tr-TR");
                                            const txId = String(item.id || item.ID || "").toLowerCase();
                                            const isStandby = txId.includes("standby") || descUpper.includes("BEKLEME");
                                            if (isStandby && dutyDatesInModal.has(d)) {
                                                return false;
                                            }
                                            return true;
                                        })
                                        .sort((a, b) => {
                                            const dateB = new Date(b.date);
                                            const dateA = new Date(a.date);
                                            const timeB = isNaN(dateB.getTime()) ? 0 : dateB.getTime();
                                            const timeA = isNaN(dateA.getTime()) ? 0 : dateA.getTime();
                                            if (timeB !== timeA) return timeB - timeA;
                                            return 0;
                                        });

                                    const displayItems = allItems.filter(tx => {
                                        if (detailFilterType === "ALL") return true;
                                        const txId = String(tx.id || tx.ID || "").toLowerCase();
                                        const descUpper = String(tx.description || tx.DESCRIPTION || "").toLocaleUpperCase("tr-TR");
                                        const dayType = getDayType(tx.date) === DAY_TYPES.HOLIDAY ? DAY_TYPES.HOLIDAY : (tx.dayType || getDayType(tx.date));
                                        const isHolidayDate = dayType === DAY_TYPES.HOLIDAY;
                                        const isFmi = descUpper.includes("FMİ") || descUpper.includes("FMI") || descUpper.includes("F.M.İ") || txId.includes("fmi") || tx.type === TRANSACTION_TYPES.USED;
                                        const isPlannedDuty = !isFmi && !descUpper.includes("PLANSIZ") && (txId.includes("auto_duty") || descUpper.includes("OTOMATİK GÖREV") || descUpper.includes("PLANLI GÖREV") || descUpper.includes("PLANLI GOREV") || tx.isPlanned === true);

                                        const isDutyAction = txId.includes("duty") || txId.includes("gorev") || txId.includes("excel") || descUpper.includes("BAKIM") || descUpper.includes("UÇUŞ") || descUpper.includes("UCUS") || descUpper.includes("PLANSIZ");
                                        const hasPureBekleme = !isDutyAction && (tx.isStandbySync || tx.isHolidayStandby || tx.isStandby || txId.includes("standby") || descUpper.includes("BEKLEME-") || descUpper.startsWith("BEKLEME") || descUpper.startsWith("RESMİ BEKLEME") || descUpper.startsWith("RESMI BEKLEME") || descUpper.startsWith("RESMİ TATİL BEKLEME") || descUpper.startsWith("RESMI TATIL BEKLEME"));
                                        
                                        const isHolidayStandby = !isFmi && !isPlannedDuty && hasPureBekleme && (isHolidayDate || isExplicitHolidayStandby);

                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-[10px] font-black text-amber-400 uppercase tracking-widest bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-lg">
                                            FMİ KULLANIM FORMU
                                        </span>
                                    </div>
                                </div>

                                {/* FMI Entries Table with Orange Highlight for Attendance Match */}
                                <div>
                                    <div className="flex items-center justify-between mb-2">
                                        <h4 className="text-xs font-black text-amber-400 uppercase tracking-widest flex items-center gap-2">
                                            <Icon name="Calendar" size={14} /> Girilen FMİ İzinleri Listesi ({fmiItems.length})
                                        </h4>
                                        <span className="text-[10px] text-forest-400">
                                            * Yoklamada FMİ kaydı olanlar <span className="text-amber-400 font-bold">turuncu dolgu</span> ile gösterilmiştir.
                                        </span>
                                    </div>

                                    {fmiItems.length === 0 ? (
                                        <div className="p-6 text-center bg-forest-900/30 rounded-2xl border border-dashed border-forest-800 text-forest-400 text-xs font-bold">
                                            Bu personele ait kayıtlı FMİ izin bulunamadı. Form bilgilerini aşağıdan el ile girebilirsiniz.
                                        </div>
                                    ) : (
                                        <div className="space-y-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                                            {fmiItems.map((item) => {
                                                const isSelected = selectedFmiIds.includes(item.id);
                                                const isOrangeFill = item.isFmiInAttendance;
                                                return (
                                                    <div 
                                                        key={item.id}
                                                        onClick={() => toggleFmiItemSelection(item.id)}
                                                        className={`p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between gap-3 ${
                                                            isOrangeFill 
                                                                ? 'bg-amber-500/20 border-amber-500/40 text-amber-200 shadow-sm' 
                                                                : 'bg-forest-900/40 border-forest-800 text-forest-200 hover:bg-forest-800/40'
                                                        }`}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={isSelected}
                                                                onChange={() => toggleFmiItemSelection(item.id)}
                                                                className="w-4 h-4 rounded border-amber-500 text-amber-600 focus:ring-amber-500 cursor-pointer"
                                                            />
                                                            <div>
                                                                <p className="font-extrabold text-xs text-white flex items-center gap-2">
                                                                    <span>{item.date}</span>
                                                                    {isOrangeFill && (
                                                                        <span className="text-[9px] bg-amber-500 text-forest-950 px-1.5 py-0.2 rounded font-black uppercase">
                                                                            YOKLAMADA FMİ
                                                                        </span>
                                                                    )}
                                                                </p>
                                                                <p className="text-[11px] opacity-80">{item.description}</p>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="font-black text-xs">{item.hours || 8} Saat</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                                {/* Form Info Inputs / Preview */}
                                <div className="bg-forest-950/80 p-5 rounded-2xl border border-forest-800/80 space-y-4">
                                    <h4 className="text-xs font-black text-emerald-400 uppercase tracking-widest flex items-center gap-2 border-b border-forest-800/60 pb-2">
                                        <Icon name="FileCheck" size={14} /> Form İçeriği Ve Bilgileri
                                    </h4>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[11px] font-bold text-forest-400 mb-1 uppercase">Başlık</label>
                                            <input 
                                                type="text" 
                                                value="Havacılık Dairesi Başkanlığı" 
                                                disabled 
                                                className="w-full bg-forest-900/80 border border-forest-800 rounded-xl p-2.5 text-xs text-white font-extrabold"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-forest-400 mb-1 uppercase">Form Adı</label>
                                            <input 
                                                type="text" 
                                                value="Fazla Mesai İzni (FMİ) Kullanım Formu" 
                                                disabled 
                                                className="w-full bg-forest-900/80 border border-forest-800 rounded-xl p-2.5 text-xs text-white font-extrabold"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[11px] font-bold text-forest-400 mb-1 uppercase">Personel Bilgileri</label>
                                        <input 
                                            type="text" 
                                            value={fmiSelectedPerson.fullName || ''} 
                                            disabled 
                                            className="w-full bg-forest-900/80 border border-forest-800 rounded-xl p-2.5 text-xs text-white font-extrabold uppercase"
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-[11px] font-bold text-amber-400 mb-1 uppercase">Başlangıç Tarihi</label>
                                            <input 
                                                type="date" 
                                                value={fmiStartDate} 
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setFmiStartDate(val);
                                                    if (fmiEndDate && new Date(fmiEndDate) < new Date(val)) {
                                                        setFmiEndDate(val);
                                                    }
                                                }}
                                                className="w-full bg-forest-900 border border-forest-700 rounded-xl p-2.5 text-xs text-white font-bold focus:border-amber-500 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-amber-400 mb-1 uppercase">Bitiş Tarihi</label>
                                            <input 
                                                type="date" 
                                                min={fmiStartDate}
                                                value={fmiEndDate} 
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setFmiEndDate(val);
                                                    if (fmiStartDate && new Date(val) < new Date(fmiStartDate)) {
                                                        setFmiStartDate(val);
                                                    }
                                                }}
                                                className="w-full bg-forest-900 border border-forest-700 rounded-xl p-2.5 text-xs text-white font-bold focus:border-amber-500 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-emerald-400 mb-1 uppercase">Gün Sayısı</label>
                                            <input 
                                                type="number" 
                                                min="1"
                                                value={fmiDayCount} 
                                                onChange={(e) => setFmiDayCount(parseInt(e.target.value) || 1)}
                                                className="w-full bg-forest-900 border border-forest-700 rounded-xl p-2.5 text-xs text-white font-bold focus:border-emerald-500 focus:outline-none"
                                            />
                                        </div>
                                    </div>

                                    {/* Signature Preview Note */}
                                    <div className="pt-2 border-t border-forest-800/60 flex items-center justify-between text-[11px] text-forest-400">
                                        <span className="flex items-center gap-1.5"><Icon name="PenTool" size={13} className="text-forest-500" /> Sol alt: Personelin Adı Soyadı</span>
                                        <span className="flex items-center gap-1.5"><Icon name="UserCheck" size={13} className="text-forest-500" /> Sağ alt: Sorumlu Amir</span>
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="flex items-center justify-end gap-3 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => setFmiFormModalOpen(false)}
                                        className="px-4 py-2.5 bg-forest-800 hover:bg-forest-700 text-forest-300 rounded-xl text-xs font-bold transition-all"
                                    >
                                        Vazgeç
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            const selectedObjects = fmiItems.filter(i => selectedFmiIds.includes(i.id));
                                            generateFmiPdfForm(fmiSelectedPerson, fmiStartDate, fmiEndDate, fmiDayCount, selectedObjects);
                                        }}
                                        className="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-black uppercase tracking-wider transition-all shadow-lg hover:scale-[1.02] active:scale-95 flex items-center gap-2"
                                    >
                                        <Icon name="Printer" size={16} />
                                        <span>Form Oluştur Ve Yazdır (PDF)</span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </Modal>

                    {/* Footer / Floating Back Button */}
                    <footer className="mt-12 text-center flex flex-col items-center gap-4">
                        <p className="text-forest-700 text-[10px] font-bold uppercase tracking-[0.2em] animate-pulse">&copy; 2024 Havacılık Yönetim ve Takip Sistemi</p>
                    </footer>

                    {/* Photo Hover Preview Overlay */}
                    {hoverPhoto && (
                        <div 
                            className="fixed z-[9999] pointer-events-none border-4 border-forest-500 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.9)] overflow-hidden animate-fade-in bg-forest-900 flex items-center justify-center"
                            style={{ 
                                left: Math.min(mousePos.x + 20, window.innerWidth - 220), 
                                top: Math.min(mousePos.y - 100, window.innerHeight - 220),
                                width: '200px',
                                height: '200px'
                            }}
                        >
                            <SafeImage src={hoverPhoto.url} personId={hoverPhoto.personId} className="personnel-photo-square" />
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[10000] animate-slide-up max-w-[92vw] sm:max-w-xl">
                            <div className={`px-6 py-4 rounded-2xl shadow-2xl border-2 flex items-center gap-3.5 bg-forest-950/95 backdrop-blur-xl ${
                                toast.type === 'error' ? 'border-rose-500 text-rose-400' :
                                toast.type === 'warning' ? 'border-amber-500 text-amber-400' :
                                'border-emerald-500 text-emerald-400'
                            }`}>
                                <Icon name={toast.type === 'error' ? 'AlertTriangle' : toast.type === 'warning' ? 'AlertCircle' : 'CheckCircle2'} size={24} className="shrink-0" />
                                <span className="font-bold text-xs sm:text-sm leading-snug whitespace-pre-line text-white">{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Native-Bypass Custom Confirmation Dialog */}
                    {confirmDialog && (
                        <div className="fixed inset-0 z-[10100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in" id="custom-confirm-modal">
                            <div className="bg-forest-900 border-2 border-forest-600/50 w-full max-w-md rounded-2xl shadow-[0_0_80px_rgba(0,0,0,0.95)] overflow-hidden animate-slide-up">
                                <div className="px-6 py-5 border-b border-forest-800 bg-forest-950/40">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2.5 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
                                            <Icon name="HelpCircle" size={20} />
                                        </div>
                                        <h3 className="font-extrabold text-lg text-white tracking-wide">İşlem Onayı</h3>
                                    </div>
                                </div>
                                <div className="p-6">
                                    <p className="text-forest-200 text-sm font-medium leading-relaxed">{confirmDialog.message}</p>
                                </div>
                                <div className="px-6 py-4 bg-forest-950/50 border-t border-forest-800/80 flex items-center justify-end gap-3">
                                    <button 
                                        onClick={() => setConfirmDialog(null)}
                                        className="px-4 py-2 bg-forest-800 hover:bg-forest-750 text-forest-300 hover:text-white rounded-xl text-xs font-black transition-all border border-forest-700/50"
                                        id="confirm-cancel-btn"
                                    >
                                        HAYIR, İPTAL ET
                                    </button>
                                    <button 
                                        onClick={async () => {
                                            const cb = confirmDialog.onConfirm;
                                            setConfirmDialog(null);
                                            await cb();
                                        }}
                                        className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black shadow-lg shadow-emerald-900/40 hover:shadow-emerald-900/60 transition-all flex items-center gap-1.5"
                                        id="confirm-approve-btn"
                                    >
                                        <Icon name="Check" size={14} /> EVET, ONAYLA
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
